name: Test Release

on:
  workflow_dispatch:
    inputs:
      SQLITE_VERSION:
        type: string
        description: "SQLite version to use"
        required: false
        default: ""

jobs:
  test_release:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        api-level: [29]
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: "17"
          distribution: "adopt"

      - name: Get SQLite version
        id: sqlite_version
        run: |
          if [ -z "${{ github.event.inputs.SQLITE_VERSION }}" ]; then
            SQLITE_VERSION="$(./gradlew -q printLatestSQLiteVersion)"
          else
            SQLITE_VERSION="${{ github.event.inputs.SQLITE_VERSION }}"
          fi
          echo "SQLITE_VERSION=$SQLITE_VERSION" >> $GITHUB_OUTPUT

      - name: Build Gradle args
        id: gradle_args
        run: |
          GRADLE_EXTRA_ARGS=""
          if [ -n "${{ steps.sqlite_version.outputs.SQLITE_VERSION }}" ]; then
            GRADLE_EXTRA_ARGS="$GRADLE_EXTRA_ARGS -PVERSION_NAME=${{ steps.sqlite_version.outputs.SQLITE_VERSION }}"
          fi
          echo "extra_args=$GRADLE_EXTRA_ARGS" >> $GITHUB_OUTPUT

      - name: Run Android tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          arch: x86
          script: ./gradlew :verify-published:connectedAndroidTest -PPUBLISH_TYPE=Final ${{ steps.gradle_args.outputs.extra_args }} --stacktrace

      - name: Upload results
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: instrumentation-test-results ${{ matrix.api-level }}
          path: ./**/build/reports/androidTests/connected/**
